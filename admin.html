<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Admin | Falstore</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/font-awesome.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body{background:#f4f6f8}.admin-shell{padding:32px 0}.admin-card{background:#fff;padding:24px;margin-bottom:24px;border:1px solid #e5e7eb}.admin-card h3{margin-top:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.stat{padding:18px;background:#15161d;color:#fff}.stat strong{font-size:24px;display:block}.admin-form .input,.admin-form textarea{margin-bottom:12px;width:100%}.admin-form textarea{min-height:100px;padding:10px}.admin-actions button{margin-right:8px}.product-row{display:flex;gap:16px;align-items:center;border-top:1px solid #eee;padding:14px 0}.product-row img{width:70px;height:70px;object-fit:contain}.product-row .meta{flex:1}.muted{color:#6b7280}.error{color:#991b1b;background:#fee2e2;padding:10px}.success{color:#166534;background:#dcfce7;padding:10px}@media(max-width:767px){.stats{grid-template-columns:repeat(2,1fr)}.product-row{align-items:flex-start}}
  </style>
</head>
<body>
  <header><div id="header"><div class="container"><div class="header-logo"><a class="logo" href="index.html"><img src="img/logo.png" alt="Falstore"></a></div></div></div></header>
  <main class="admin-shell"><div class="container"><div class="admin-card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><h1>Dashboard Admin</h1><p class="muted" id="admin-user"></p></div><button class="primary-btn" id="logout">Keluar</button></div></div>
    <div id="message"></div>
    <section class="stats" id="stats"></section>
    <section class="admin-card"><h3>Tambah / Edit Produk</h3><form class="admin-form" id="product-form"><input type="hidden" name="id"><input class="input" name="name" placeholder="Nama produk" required><input class="input" name="slug" placeholder="Slug (opsional)"><select class="input" name="category"><option value="laptop">Laptop</option><option value="smartphone">Smartphone</option><option value="kamera">Kamera</option><option value="aksesori" selected>Aksesori</option></select><input class="input" type="number" name="price" min="0" placeholder="Harga" required><input class="input" type="number" name="oldPrice" min="0" placeholder="Harga lama (opsional)"><input class="input" type="number" name="stock" min="0" placeholder="Stok" required><textarea name="description" placeholder="Deskripsi produk"></textarea><label>Gambar produk <input type="file" name="imageFile" accept="image/jpeg,image/png,image/webp,image/gif"></label><input type="hidden" name="image"><label style="display:block;margin:12px 0"><input type="checkbox" name="isFeatured"> Produk unggulan</label><button class="primary-btn" type="submit">Simpan Produk</button><button class="primary-btn" type="button" id="reset-form">Bersihkan</button></form></section>
    <section class="admin-card"><h3>Daftar Produk</h3><div id="products"></div></section>
  </div></main>
<script>
(function(){'use strict';
 const token=localStorage.getItem('falstore-token'); const user=JSON.parse(localStorage.getItem('falstore-user')||'null'); const message=document.querySelector('#message');
 const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
 const money=value=>'Rp'+new Intl.NumberFormat('id-ID').format(value);
 const api=(url,opt={})=>fetch(url,{...opt,headers:{...(opt.body instanceof FormData?{}:{'Content-Type':'application/json'}),Authorization:'Bearer '+token}}).then(async r=>{const p=await r.json().catch(()=>({}));if(!r.ok)throw Error(p.error||'Permintaan gagal');return p});
 const show=(text,type='error')=>{message.className=type;message.textContent=text};
 if(!token||!user||user.role!=='admin'){location.href='account.html';return} document.querySelector('#admin-user').textContent=user.name+' · '+user.email;
 async function load(){const [stats,products]=await Promise.all([api('/api/admin/stats'),api('/api/admin/products')]);document.querySelector('#stats').innerHTML=[['Produk',stats.stats.products],['Customer',stats.stats.customers],['Pesanan',stats.stats.orders],['Pendapatan',money(stats.stats.revenue)]].map(x=>'<div class="stat"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('');document.querySelector('#products').innerHTML=products.products.length?products.products.map(p=>'<div class="product-row"><img src="'+esc(p.image)+'" alt="'+esc(p.name)+'"><div class="meta"><strong>'+esc(p.name)+'</strong><div class="muted">'+esc(p.category)+' · '+money(p.price)+' · stok '+p.stock+'</div></div><div class="admin-actions"><button class="primary-btn edit" data-id="'+p.id+'">Edit</button><button class="primary-btn delete" data-id="'+p.id+'">Hapus</button></div></div>').join(''):'<p class="muted">Belum ada produk.</p>';document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>edit(products.products.find(p=>p.id===Number(b.dataset.id))));document.querySelectorAll('.delete').forEach(b=>b.onclick=async()=>{if(!confirm('Hapus produk ini?'))return;try{await api('/api/admin/products/'+b.dataset.id,{method:'DELETE'});show('Produk dihapus.','success');load()}catch(e){show(e.message)}})}
 function edit(p){const f=document.querySelector('#product-form');for(const key of ['id','name','slug','category','price','oldPrice','stock','description','image'])f.elements[key].value=p[key]??'';f.elements.isFeatured.checked=p.isFeatured;window.scrollTo({top:document.querySelector('#product-form').offsetTop-20,behavior:'smooth'})}
 document.querySelector('#reset-form').onclick=()=>document.querySelector('#product-form').reset();
 document.querySelector('#logout').onclick=()=>{localStorage.removeItem('falstore-token');localStorage.removeItem('falstore-user');location.href='account.html'};
 document.querySelector('#product-form').onsubmit=async event=>{event.preventDefault();const f=event.currentTarget;try{let image=f.elements.image.value;if(f.elements.imageFile.files[0]){const body=new FormData();body.append('image',f.elements.imageFile.files[0]);image=(await api('/api/admin/uploads/image',{method:'POST',body})).url}const body={name:f.elements.name.value,slug:f.elements.slug.value,category:f.elements.category.value,price:Number(f.elements.price.value),oldPrice:f.elements.oldPrice.value?Number(f.elements.oldPrice.value):null,stock:Number(f.elements.stock.value),description:f.elements.description.value,image,isFeatured:f.elements.isFeatured.checked};const id=f.elements.id.value;await api(id?'/api/admin/products/'+id:'/api/admin/products',{method:id?'PUT':'POST',body:JSON.stringify(body)});show('Produk berhasil disimpan.','success');f.reset();await load()}catch(e){show(e.message)}};
 load().catch(e=>show(e.message));
}());
</script>
</body>
</html>
